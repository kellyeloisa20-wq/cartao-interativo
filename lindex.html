
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="card-header">
                <span class="badge">DESTAQUE</span>
                <div class="icon">🚀</div>
            </div>

            <div class="card-content">
                <h1>Meu Cartão</h1>

                <p class="description">
                    Bem-vindo! Este é um cartão interativo
                    criado para finalidades de trabalho.
                </p>

                <div class="extra-info" id="extraInfo">
                    <p> Obrigado por visitar nosso cartão!</p>
                    <p> Desenvolvido com tecnologia web.</p>
                </div>

                <div class="buttons">
                    <button id="infoButton" class="btn-primary">
                        Ver mais informações
                    </button>

                    <button id="likeButton" class="btn-like">
                        ❤️ Curtir <span id="likeCount">0</span>
                    </button>
                </div>
            </div>

            <div class="card-footer">
                <span>Desenvolvido por você</span>
                <span>2026 ©</span>
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
